# edge_detect_params.yaml — 边缘检测节点参数配置

edge_detect_node:
  ros__parameters:
    # ══════════════════════════════════════════════════════════════════════════
    #  深度图检测参数
    # ══════════════════════════════════════════════════════════════════════════

    # ROI（感兴趣区域）- 图像下半部分对应前方路面
    # Aurora 930 分辨率: 640x400
    roi_y_start: 200          # ROI起始行（图像中间偏下）

    # 有效深度范围 (mm)
    # 桌面到相机距离约 200mm 以上，设置合理范围
    depth_min_mm: 150         # 有效深度最小值
    depth_max_mm: 600         # 有效深度最大值（超过此值视为无效或非桌面）

    # 边缘检测阈值（已弃用，使用比例阈值）
    edge_threshold_mm: 100    # 深度突变阈值 (mm)

    # ══════════════════════════════════════════════════════════════════════════
    #  检测确认参数
    # ══════════════════════════════════════════════════════════════════════════

    edge_confirm_frames: 2    # 连续检测到边缘的帧数才确认（避免误检）
    safe_confirm_frames: 3    # 连续未检测到边缘的帧数才确认安全

    # ══════════════════════════════════════════════════════════════════════════
    #  运动控制参数
    # ══════════════════════════════════════════════════════════════════════════

    # 前进速度 (m/s)
    move_speed: 0.15

    # 转向速度 (rad/s) - 最大不超过 0.2
    turn_speed: 0.15

    # 转向角度 (度) - 23度
    turn_angle_deg: 23

    # ══════════════════════════════════════════════════════════════════════════
    #  启动参数
    # ══════════════════════════════════════════════════════════════════════════

    # 自动启动任务（false = 需要手动发送启动指令）
    auto_start: false
