# balance_beam_params.yaml — 独木桥导航（PD控制版）
#
# ══════════════════════════════════════════════════════════════════════════
#  调参指南（类似寻线小车）
# ══════════════════════════════════════════════════════════════════════════
#
# 1. 先只调 steering_kp（P增益）：
#    - 设 steering_kd = 0
#    - 从小值开始（0.05），逐渐增大
#    - 直到小车能跟上桥面偏移，但会有轻微振荡
#    - 这时的值就是"临界增益"Ku
#
# 2. 再调 steering_kd（D增益）：
#    - 从 Ku * 0.1 开始
#    - 逐渐增大，直到振荡消失
#    - D项的作用：预测误差趋势，提前抑制
#
# 3. 如果有持续偏移（稳态误差）：
#    - 可以加很小的 steering_ki（I增益）
#    - 但独木桥一般不需要I项
#
# ══════════════════════════════════════════════════════════════════════════
#  参数说明
# ══════════════════════════════════════════════════════════════════════════
#
#  steering_kp: P增益（比例）
#    - 控制"响应力度"
#    - 增大 → 反应更快，但可能振荡
#    - 减小 → 更平滑，但响应慢
#    - 推荐范围: 0.08 ~ 0.25
#
#  steering_kd: D增益（微分）
#    - 控制"抑制振荡"
#    - 增大 → 更稳定，抑制过冲
#    - 减小 → 更灵活，但可能振荡
#    - 推荐范围: 0.05 ~ 0.20
#
#  max_steering: 最大转向限制
#    - 防止过度转向
#    - 推荐范围: 0.04 ~ 0.10
#
#  move_speed: 前进速度
#    - 速度越快，需要的P增益越大
#    - 推荐范围: 0.15 ~ 0.25
#
# ══════════════════════════════════════════════════════════════════════════

balance_beam_node:
  ros__parameters:
    # 桥面检测
    roi_y_start: 200
    roi_y_end: 400

    # 运动参数
    move_speed: 0.25          # 前进速度（加快）

    # PD控制参数（核心调参）
    steering_kp: 0.15         # P增益：响应力度
    steering_kd: 0.10         # D增益：抑制振荡
    max_steering: 0.06        # 最大转向限制

    # 桥面丢失判断
    lost_threshold: 0.7

    # 调试
    publish_debug_image: true
    auto_start: false
