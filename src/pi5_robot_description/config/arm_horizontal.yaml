# 机械臂水平姿态关节角度 (URDF 弧度)
# 对应舵机命令: {#0P1550T1000!#1P1850T1000!#2P2100T1000!#3P1100T1000!#4P1500T1000!}
# 舵机1500 = URDF 0弧度 (竖直), 范围: 500-2500 -> -2.356 ~ +2.356 rad
#
# 转换公式: rad = (pwm - 1500) * 2.356 / 1000
# 注意: 这些值需要根据实际机械臂姿态微调!
# 建议: 先用 view_robot.launch.py 在 RViz 中观察，再调整数值

joint_states:
  joint1: 0.118     # PWM1550, 底座旋转 (6.7 deg)
  joint2: 0.825     # PWM1850, 肩关节 (47.2 deg from vertical)
  joint3: 1.414     # PWM2100, 肘关节 (81.0 deg from vertical)
  joint4: -0.942    # PWM1100, 腕关节 (-54.0 deg)
  joint5: 0.000     # PWM1500, 末端 (0 deg)
