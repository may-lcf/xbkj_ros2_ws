# 机器人参数配置

# STM32 通信参数
stm32_bridge:
  ros__parameters:
    serial_port: '/dev/ttyUSB0'
    baudrate: 115200
    timeout: 0.001
    odom_frame_id: 'odom'
    base_frame_id: 'base_footprint'
    publish_tf: true

# 小车控制参数
car_controller:
  ros__parameters:
    linear_scale: 0.5
    angular_scale: 1.0
    control_mode: 'joy'  # joy/keyboard/auto

# 机械臂参数
arm_controller:
  ros__parameters:
    arm_type: '6dof'  # 4dof/6dof
    default_speed: 1000  # ms

# 协调器参数
coordinator:
  ros__parameters:
    navigation_tolerance: 0.1  # m
    angle_tolerance: 0.2  # rad
    max_linear_speed: 0.5  # m/s
    max_angular_speed: 1.0  # rad/s
